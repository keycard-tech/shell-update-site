name: sync and deploy

on:
  push:
    branches: [master]
  schedule:
    # Backstop for a release that published while no trigger reached us; see README.
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two releases published back to back queue instead of racing to replace the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: site base
        # Pages serves the repository under /<repo>/ until the domain in CNAME takes over; assets 404 if wrong.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ vars.SITE_BASE }}
        run: |
          cname=$(cat CNAME)
          domain=$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .custom_domain 2>/dev/null || true)

          if [ -n "$OVERRIDE" ]; then base=$OVERRIDE
          elif [ "$domain" = "$cname" ]; then base=/
          else base="/${GITHUB_REPOSITORY#*/}/"
          fi

          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          echo "Pages custom domain ${domain:-none}, CNAME $cname: building for $base"
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4

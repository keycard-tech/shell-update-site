name: sync and deploy

on:
  push:
    branches: [master]
  schedule:
    # Backstop for a release that published while no trigger reached us; see README.
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two releases published back to back queue instead of racing to replace the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: site base
        # A CNAME means the site has a domain of its own and is served at its root; without one, Pages serves
        # the repository under /<repo>/. Pages' API lags a domain change by as long as this site has been live,
        # so nothing reads it here — and `npm run check` refuses a base that contradicts the CNAME.
        run: |
          cname=$([ -f CNAME ] && tr -d '[:space:]' < CNAME)

          if [ -n "$cname" ]; then base=/; else base="/${GITHUB_REPOSITORY#*/}/"; fi

          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          echo "CNAME ${cname:-none}: building for $base"
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4

name: sync and deploy

on:
  push:
    branches: [master]
  schedule:
    # Backstop for a release that published while no trigger reached us; see README.
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two releases published back to back queue instead of racing to replace the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
